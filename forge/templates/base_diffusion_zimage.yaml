job: extension
config:
  name: last
  process:
  - type: diffusion_trainer
    training_folder: /app/checkpoints
    device: cuda
    network:
      type: lora
      linear: 32
      linear_alpha: 32
      conv: 16
      conv_alpha: 16
    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 4
      save_format: diffusers
    datasets:
    # caption_dropout_rate 0.05 ADDED 2026-08-18 (WEEK-9).  The refusal that
    # used to live here ("both Aug-3 rank-1 z-image configs omit the key") was
    # correct on Aug-3 evidence and is SUPERSEDED by three straight boss-task
    # results (week9-zimage-lane REPORT §3.3):
    #   * 5GU4Xkd3 won the LAST THREE z-image boss tasks (Aug-10 bd3a04d8,
    #     Aug-17 8ab17505 + e62885b4) running THIS TEMPLATE almost verbatim
    #     plus exactly two deltas: caption_dropout_rate 0.05 + flat 1000 steps.
    #   * 5FpdSckw — previously dropout-free — now ships 0.05 too (e62885b4).
    #   * Field consensus: 3/3 published z-image configs in the Aug-17
    #     tournament carry 0.05.  (Aug-3's two dropout-free winners are the
    #     OLD meta; operating note 8: capability snapshots decay in one week.)
    # MECHANISM (traced at ai-toolkit pin 99be3d96 for this change): parsed
    # toolkit/config_modules.py:919 (DatasetConfig, default 0.0); consumed
    # toolkit/dataloader_mixins.py:387-392 — per sample per epoch, `rand <
    # rate` replaces the caption with '' BEFORE trigger-word injection, so the
    # dropped caption trains the exact blank-prompt conditioning that carries
    # 75% of the score.  The gate requires `not cache_text_embeddings`: LIVE
    # here (we cache LATENTS, not text embeds; train block has no
    # cache_text_embeddings -> default False, config_modules.py:544).
    # Direction is INFERRED (no same-depth A/B exists anywhere in the field —
    # dropout and depth are confounded in every winning pair); adoption is
    # field-parity under operating note 5, not a measured win.
    # Guarded by tests/test_blank_prompt_training.py +
    # tests/test_week9_recipe_pins.py.
    - folder_path: /dataset/images
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: true
      resolution: [512, 768, 1024]
      is_reg: false
    train:
      batch_size: 1
      steps: 2000
      lr: 0.0001
      optimizer: adamw8bit
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      timestep_type: weighted
      # WEEK-9 (2026-08-18): min_denoising_steps 100 ADDED — the value the
      # Aug-3 z-image rank-1 5FBmn1ax shipped (b2582457, config.yaml), the
      # only field z-image value ever observed for this key.
      # TRACED at ai-toolkit pin 99be3d96: parsed toolkit/config_modules.py
      # :369 (train.min_denoising_steps, default 0) -> BaseSDTrainProcess.py
      # :1148 -> 'balanced' branch :1276-1293 (flowmatch: min_idx =
      # min_noise_steps, randint(min_idx, max_idx)) -> :1297-1298 timesteps =
      # noise_scheduler.timesteps[indices].  For timestep_type 'weighted' the
      # array is torch.linspace(1000, 1) — DESCENDING (toolkit/samplers/
      # custom_flowmatch_sampler.py:107-118) — so excluding indices 0-99
      # excludes t in (~900, 1000]: EXACTLY the band the z-image evaluator
      # (denoise 0.90, G.O.D constants.py:28) never visits.  Re-aims ~10% of
      # the step budget into the scored band on BOTH scored terms
      # (week9-zimage-lane REPORT §2.3 L7: "the cheapest true alignment lever
      # we are not shipping").  Theory: SpeeD (CVPR 2025, arXiv:2405.17403) —
      # near-T convergence-area steps contribute little (week9-research-scout
      # REPORT §1 F1.1, verdict THIS-WEEK, field value per type).
      # content_or_style is absent -> 'balanced' (config_modules.py:356), so
      # the traced branch is the live one.  Guarded by
      # tests/test_week9_recipe_pins.py.
      min_denoising_steps: 100
      dtype: bf16
      # ADDED (was absent -> toolkit default 'mse', toolkit/config_modules.py:502
      # at ai-toolkit pin 99be3d96).  Consumed at extensions_built_in/sd_trainer/
      # SDTrainer.py:818; any other string silently falls through to the mse
      # `else` at :827, so tests/test_loss_and_ema_policy.py asserts the literal.
      #
      # The direct z-image observation is ONE task and is confounded — Aug-3
      # b2582457, where the only mae entrant won:
      #   .../tournament-...-b2582457-...-5FBmn1ax  mae, ema 0.995, 1317 steps,
      #       min_denoising_steps 100, rank 1, 0.061716
      #   .../tournament-...-b2582457-...-5GU4Xkd3  mse, ema off,   1000 steps,
      #       caption_dropout 0.05,          rank 2, 0.063187   (+2.38%)
      # That alone would NOT justify the change.  What justifies it is that the
      # lever is carried by evidence from OUTSIDE this type: the clean,
      # depth-matched, terminal-export pair on Aug-3 krea2 41025fb5 (+8.39% for
      # mse) replicated with the operator identity crossed over on Jul-27 krea2
      # 73013636 (+2.99%) — see base_diffusion_krea2.yaml for the full citation
      # and the mechanism argument.  loss_type is an architecture-independent
      # property of the flow-matching objective, and 5FBmn1ax runs mae on all
      # three of krea2/z-image/qwen while keeping mse on ideogram4, so it is
      # treating this as a per-family choice, not a per-arch accident.
      #
      # NOTE the shape of what is being copied: 5FBmn1ax's b2582457 config is
      # this template almost verbatim (network 32/32 + conv 16/16, quantize +
      # quantize_te, assistant_lora_path, timestep_type weighted, lr 1e-4,
      # optimizer adamw8bit, resolution [512,768,1024]) plus exactly three keys —
      # loss_type: mae, ema_config, and min_denoising_steps: 100.  Only the first
      # is taken here; see the EMA note below for why the second is refused, and
      # min_denoising_steps is not this unit's lever.
      # REVERTED TO mse 2026-08-16 (week-8).  The Aug-10 tournament ran three
      # krea2 R1 tasks; 5HKEAZxF SWEPT all three running mse and we placed
      # 10th/5th/6th running mae, 10-20% behind.  On 797f3e7b we shipped 1752
      # steps to its 1800 -- same epoch, same ai-toolkit 0.10.17, same UNet-only
      # 512-tensor recipe, same data -- and lost by 10.50%.  That is the closest
      # to a depth-matched mae-vs-mse read the field has produced, and mae is on
      # the losing side of it.
      # HONEST LIMITS (audit, 2026-08-12): the sweeper's config for 797f3e7b was
      # NOT captured, so its mse is INFERRED from its other two tasks; runtime
      # commit, seed and preprocessing are unobserved.  This does NOT prove mae
      # caused the gap.  mse is reverted to because it is the ai-toolkit default
      # (config_modules.py:502), the field standard, and what the sweeper ran --
      # i.e. the conservative baseline.  mae remains a live hypothesis and is to
      # be tested in a controlled same-runtime, same-data, multi-seed experiment,
      # never again promoted from a single confounded pair.
      loss_type: mse
      # NO ema_config — z-image EMA is REFUSED, unlike qwen-image.  The z-image
      # field is 8 published configs and the EMA contrast is a coin flip:
      #   * 6 of 8 ran EMA off (5 of those never wrote the key at all, so the
      #     "majority" is mostly an omission rather than a decision), and 3 of
      #     the 4 rank-1 slots are EMA-off (42112d9b 5FpdSckw, c8733e67 5GpcTKW7,
      #     b290d171 5EACrayt).
      #   * Both EMA-ON entrants are confounded and neither is usable: Aug-3
      #     b2582457 5FBmn1ax also carries mae + 317 more steps +
      #     min_denoising_steps; Jul-27 c8733e67 5HKEAZxF (rank 2) ships a
      #     `last_premerge.safetensors`, and the EMA-OFF entrant that beat it by
      #     3.61% at near-matched depth (1222 vs 1200) ships
      #     `checkpoint-soup.safetensors` + `last.unselected.safetensors` and
      #     promoted step 1100 — that pair measures merge/selection machinery,
      #     not EMA.
      # Against a coin flip there is a MEASURED cost.  At the pinned runtime the
      # exported adapter IS the shadow (BaseSDTrainProcess.py:495-497 ema.eval()
      # -> store()+copy_to() before the write, :697-698 ema.train() after), the
      # shadow is seeded at init (toolkit/ema.py:61-64) while lora_up is
      # zero-init (toolkit/lora_special.py:122), and setup_ema
      # (BaseSDTrainProcess.py:769-781) never passes use_num_updates, so the
      # decay is fixed from step 1 (ema.py:57 + :118-123).  At z-image's planned
      # 1186 (b290d171) and 1315 (b2582457) steps under this template's constant
      # LR (no lr_scheduler key -> 'constant', config_modules.py:367) decay 0.995
      # exports lora_up at 0.833 / 0.849 of its live magnitude on a
      # linear-growth trajectory and 0.906 / 0.916 on a sqrt one — an 8-17%
      # depth haircut bought with no measured gain.
      # THE EXPERIMENT, when there is GPU time: z-image has >20% clock slack, so
      # run 5FBmn1ax's b2582457 config with and without `ema_config` at fixed
      # steps and score both with the validator stack.  It is a one-variable
      # A/B and it is the only way to settle this.
      # Guarded by tests/test_loss_and_ema_policy.py.
    model:
      name_or_path: /cache/models
      arch: zimage:turbo
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
      assistant_lora_path: /cache/hf_cache/zimage_turbo_training_adapter_v2.safetensors
meta:
  name: zimage_lora
  version: '1.0'

